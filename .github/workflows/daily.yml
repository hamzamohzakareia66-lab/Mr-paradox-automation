name: Mr Paradox Multi-Language Automation

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Paradox Automation
        run: python main.py

      - name: Commit Updated Storefront
        run: |
          git config --global user.name "MrParadoxBot"
          git config --global user.email "bot@mrparadox.com"
          git add index.html
          git commit -m "Auto-update multi-language deal [skip ci]" || exit 0
          git push
          
